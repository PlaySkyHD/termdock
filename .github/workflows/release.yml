name: Release

# A pushed tag v<version> builds the unsigned installer and creates a draft release with the installer, its blockmap
# and latest.yml (#136, ADR 0007). Nothing is published: the user checks the draft and publishes it; only published
# releases reach the auto-update of installed apps.
#
# Two jobs: `build` runs npm ci, electron-builder and the smoke test with a read-only token that is not left in the
# git config, and without the npm cache (no cache poisoning on the release path). Only `draft` gets `contents: write`;
# it checks nothing out and runs no project code, it uploads the files of `build`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Installer bauen und prüfen
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Releases come from main only: the tagged commit must be part of it.
      - name: Check that the tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      # The updater compares the version of the app with latest.yml: the tag must name the version that is built.
      - name: Check the tag against the version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match v$VERSION from apps/desktop/package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Electron binary
        shell: bash
        run: node_modules/.bin/electron --version

      # Same build as the CI job `package`: `--publish never`, electron-builder uploads nothing.
      - name: Build installer
        run: npm run dist -w apps/desktop

      - name: Smoke test of the unpacked app
        shell: bash
        working-directory: apps/desktop/release/win-unpacked
        env:
          TERMDOCK_DATA_DIR: ${{ runner.temp }}\termdock-smoke
        run: ./TermDock.exe --smoke-test

      - name: Check the update files
        shell: bash
        working-directory: apps/desktop/release
        run: |
          for file in "TermDock-Setup-$VERSION.exe" "TermDock-Setup-$VERSION.exe.blockmap" latest.yml; do
            test -s "$file" || { echo "::error::$file is missing"; exit 1; }
          done
          grep -q "TermDock-Setup-$VERSION.exe" latest.yml

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            apps/desktop/release/TermDock-Setup-${{ steps.version.outputs.version }}.exe
            apps/desktop/release/TermDock-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft-Release anlegen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      # The only step with a writing token. A draft stays invisible to installed apps until the user publishes it.
      - name: Create the draft release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$TAG" --draft --verify-tag --title "TermDock $VERSION" --generate-notes
          "TermDock-Setup-$VERSION.exe" "TermDock-Setup-$VERSION.exe.blockmap" latest.yml
